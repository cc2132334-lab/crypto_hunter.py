on:
  schedule:
    # આનો અર્થ છે દર 15 મિનિટે રન થશે (24/7)
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - run: pip install requests pytz
      - run: python crypto_hunter.py # ફાઈલનું નામ બદલ્યું છે
